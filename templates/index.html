<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Laporan Kegiatan PDF v2</title>
    <style>
        :root { --primary: #2563eb; --bg-app: #f1f5f9; --border-ui: #cbd5e1; }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Segoe UI', Calibri, Arial, sans-serif;
            background-color: var(--bg-app); display: flex; height: 100vh; overflow: hidden;
        }
        .sidebar {
            width: 400px; background: #ffffff; border-right: 1px solid var(--border-ui);
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
        }
        .sidebar h2 { margin: 0 0 5px 0; font-size: 18px; color: #1e293b; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #475569; }
        .form-group input, .form-group textarea {
            padding: 8px 10px; border: 1px solid var(--border-ui); border-radius: 6px;
            font-size: 13px; font-family: inherit;
        }
        .item-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
        .item-card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: bold; font-size: 13px;
        }
        .btn {
            padding: 9px 14px; border: none; border-radius: 6px; font-weight: 600;
            cursor: pointer; font-size: 13px; transition: 0.2s; text-align: center;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-download { background: #dc2626; color: white; font-size: 14px; padding: 12px; }
        .btn-success { background: #16a34a; color: white; font-size: 14px; padding: 12px; }
        .btn-danger { background: #ef4444; color: white; padding: 4px 8px; font-size: 11px; }
        .preview-area {
            flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; align-items: center;
        }
        .paper {
            width: 210mm; min-height: 297mm; background: white; padding: 12mm 15mm;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12); color: #000; font-family: Calibri, Arial, sans-serif;
        }
        .doc-header { text-align: center; margin-bottom: 16px; line-height: 1.35; }
        .doc-header div { font-weight: bold; font-size: 14pt; text-transform: uppercase; }
        table.report-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        table.report-table th, table.report-table td { border: 1px solid #000000; padding: 8px; vertical-align: middle; }
        table.report-table th {
            background-color: #FFF2CC; font-weight: bold; font-size: 12pt; text-align: center; padding: 6px;
        }
        .col-no { width: 8%; text-align: center; font-size: 12pt; }
        .col-foto { width: 52%; text-align: center; }
        .col-ket { width: 40%; text-align: left; font-size: 12pt; padding-left: 12px !important; }
        .photo-frame {
            display: inline-block; background: #ffffff; padding: 5px;
            border: 1px solid #d9d9d9; box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.28); margin: 4px auto;
        }
        .photo-frame img { width: 245px; height: 205px; object-fit: cover; display: block; }
        .photo-placeholder {
            width: 245px; height: 205px; background: #f1f5f9; display: flex;
            align-items: center; justify-content: center; color: #94a3b8; font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Editor Laporan PDF <small style="color:#16a34a; font-size:12px;">(v2 Native)</small></h2>
        <div class="form-group">
            <label>Judul Baris 1 (Bulan & Tahun)</label>
            <input type="text" id="in-judul1" value="LAPORAN JANUARI 2026" oninput="updateHeader()">
        </div>
        <div class="form-group">
            <label>Judul Baris 2 (Nama & Jabatan)</label>
            <input type="text" id="in-judul2" value="MUJIYONO – PPPK KEBERSIHAN" oninput="updateHeader()">
        </div>
        <div class="form-group">
            <label>Judul Baris 3 (Unit Kerja / Lokasi)</label>
            <input type="text" id="in-judul3" value="TKN SENDANGMULYO" oninput="updateHeader()">
        </div>
        <hr style="width:100%; border:0; border-top:1px solid #e2e8f0;">
        <div id="items-container" style="display:flex; flex-direction:column; gap:10px;"></div>
        <button class="btn btn-primary" onclick="addItem()">+ Tambah Kegiatan</button>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
            <button id="btn-download-pdf" class="btn btn-download" onclick="downloadPDF()">⬇️ Download to PDF</button>
            <button class="btn btn-success" onclick="window.print()">🖨️ Print / Cetak Browser</button>
        </div>
    </div>

    <div class="preview-area">
        <div class="paper">
            <div class="doc-header">
                <div id="out-judul1">LAPORAN JANUARI 2026</div>
                <div id="out-judul2">MUJIYONO – PPPK KEBERSIHAN</div>
                <div id="out-judul3">TKN SENDANGMULYO</div>
            </div>
            <table class="report-table">
                <thead>
                    <tr>
                        <th class="col-no">NO</th>
                        <th class="col-foto">FOTO KEGIATAN</th>
                        <th class="col-ket" style="text-align:center;">KETERANGAN</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let items = [
            { img: '', fileName: '', text: 'Membersihkan Wastafel' },
            { img: '', fileName: '', text: 'Membersihkan rumput halaman belakang' },
            { img: '', fileName: '', text: 'Mengepel Gazebo' }
        ];

        function updateHeader() {
            document.getElementById('out-judul1').innerText = document.getElementById('in-judul1').value;
            document.getElementById('out-judul2').innerText = document.getElementById('in-judul2').value;
            document.getElementById('out-judul3').innerText = document.getElementById('in-judul3').value;
        }
        function addItem() { items.push({ img: '', fileName: '', text: '' }); render(); }
        function removeItem(index) { items.splice(index, 1); render(); }
        function updateText(index, value) {
            items[index].text = value;
            document.getElementById(`cell-text-${index}`).innerText = value;
        }
        function processImage(index, input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            items[index].fileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                items[index].img = e.target.result;
                render();
            };
            reader.readAsDataURL(file);
        }

        async function downloadPDF() {
            const btn = document.getElementById('btn-download-pdf');
            const originalText = btn.innerText;
            btn.innerText = '⏳ Membuat PDF di Server...';
            btn.disabled = true;

            const payload = {
                judul1: document.getElementById('in-judul1').value,
                judul2: document.getElementById('in-judul2').value,
                judul3: document.getElementById('in-judul3').value,
                items: items
            };

            try {
                const response = await fetch('/generate-pdf', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error('Server error: ' + response.status);

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                const title1 = payload.judul1.trim() || 'LAPORAN_KEGIATAN';
                a.href = url;
                a.download = title1.replace(/[^a-zA-Z0-9]/g, '_') + '.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert('Gagal membuat PDF: ' + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function render() {
            const container = document.getElementById('items-container');
            const tbody = document.getElementById('table-body');
            container.innerHTML = '';
            tbody.innerHTML = '';

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                const statusFoto = item.fileName ? `<span style="color:#16a34a; font-size:11px;">✓ ${item.fileName}</span>` : '';
                card.innerHTML = `
                    <div class="item-card-header">
                        <span>Kegiatan #${index + 1}</span>
                        <button class="btn btn-danger" onclick="removeItem(${index})">Hapus</button>
                    </div>
                    <div class="form-group" style="margin-bottom:8px;">
                        <label>Foto Kegiatan (Timestamp) ${statusFoto}</label>
                        <input type="file" accept="image/*" onchange="processImage(${index}, this)">
                    </div>
                    <div class="form-group">
                        <label>Keterangan</label>
                        <textarea rows="2" oninput="updateText(${index}, this.value)">${item.text}</textarea>
                    </div>
                `;
                container.appendChild(card);

                const tr = document.createElement('tr');
                const imgHtml = item.img 
                    ? `<img src="${item.img}" alt="Foto ${index + 1}">` 
                    : `<div class="photo-placeholder">Pilih foto di panel kiri</div>`;
                tr.innerHTML = `
                    <td class="col-no">${index + 1}</td>
                    <td class="col-foto"><div class="photo-frame">${imgHtml}</div></td>
                    <td class="col-ket" id="cell-text-${index}">${item.text}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        render();
    </script>
</body>
</html>
